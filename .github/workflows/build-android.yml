name: Build Android TWA

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'src/manifest.webmanifest'
      - 'src/icon-512.png'
      - 'src/icon-maskable-512.png'
      - '.github/workflows/build-android.yml'
      - 'test/android-packaging.test.mjs'
  pull_request:
    paths:
      - 'android/**'
      - 'src/manifest.webmanifest'
      - 'src/icon-512.png'
      - 'src/icon-maskable-512.png'
      - '.github/workflows/build-android.yml'
      - 'test/android-packaging.test.mjs'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate packaging configuration and asset links generator
        run: node --test test/android-packaging.test.mjs
      - name: Build unsigned release bundle and debug-signed APK
        working-directory: android
        run: bash ./gradlew --no-daemon :app:lintRelease :app:bundleRelease :app:assembleDebug
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cgs-android-${{ github.sha }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-release.*
          if-no-files-found: error
          retention-days: 14
