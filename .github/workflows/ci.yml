name: CI

# Pull requests run through pull_request. Pushes run only for the prototype branch, which has no
# pull request of its own; other branches would otherwise run everything twice. Automation
# branches are dispatched explicitly, since their pull requests do not trigger workflows.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - codex/cgs-reading-room-prototype

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements-lock.txt
      - run: python -m pip install -r crawler/requirements-lock.txt
      - run: npm ci
      - run: npm run check

  browser:
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The About-page build and browser tests use recent Git history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium firefox webkit
      - run: npm run test:browser
      - name: Upload browser-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
