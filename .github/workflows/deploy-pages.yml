name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Production deploys only the newest main commit. Without this, a manual run from another
      # branch, or a re-run of an older run, would replace the site with older code.
      - name: Require the newest main commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deploys only from main, not $GITHUB_REF." >&2
            exit 1
          fi
          main_sha="$(git rev-parse origin/main)"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "This run is for ${GITHUB_SHA::7}, but main is now at ${main_sha::7}. Deploy from the newest run instead." >&2
            exit 1
          fi
      - name: Determine application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(git tag --points-at "$GITHUB_SHA" --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          latest="$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          package_version="v$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"

          if [[ -n "$current" ]]; then
            version="$current"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${latest:-$package_version}"
          elif [[ -n "$latest" && "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            version="$package_version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Deploying application release $version"

  build:
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 30
    env:
      CGS_APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements-lock.txt
      - run: python -m pip install -r crawler/requirements-lock.txt
      - run: npm ci
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  browser:
    runs-on: windows-latest
    needs: version
    timeout-minutes: 60
    env:
      CGS_APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium firefox webkit
      - run: npm run test:browser
      - name: Upload browser-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Tagged only after the site is live, so a failed deploy leaves no release that never shipped.
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - version
      - deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish patch release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            tagged_sha="$(git rev-list -n 1 "$RELEASE_VERSION")"
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_VERSION already points to $tagged_sha, not $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_VERSION" "$GITHUB_SHA" -m "Release $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_VERSION"
          fi

          if ! gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" --verify-tag --latest --generate-notes --title "CGS $RELEASE_VERSION"
          fi
      - name: Reuse the current release for a manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: echo "Deploying ${{ needs.version.outputs.version }} without creating a new release."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build
      - browser
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
