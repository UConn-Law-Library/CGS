name: Publish CGS Preview

# Publishes this branch's build to UConn-Law-Library/CGS-Preview, whose GitHub Pages site serves
# it at /CGS-Preview/. Production is unaffected: it deploys only from main (deploy-pages.yml).
on:
  push:
    branches:
      - codex/cgs-reading-room-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgs-preview
  cancel-in-progress: true

jobs:
  configured:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.key.outputs.ready }}
    steps:
      - name: Check for the CGS-Preview deploy key
        id: key
        env:
          DEPLOY_KEY: ${{ secrets.CGS_PREVIEW_DEPLOY_KEY }}
        run: |
          if [ -n "$DEPLOY_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CGS_PREVIEW_DEPLOY_KEY is not set, so the preview was not published. See the README."
          fi

  publish:
    runs-on: ubuntu-latest
    needs: configured
    timeout-minutes: 30
    if: needs.configured.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # The site's recent updates come from commit history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:preview
      - uses: actions/checkout@v4
        with:
          repository: UConn-Law-Library/CGS-Preview
          ref: main
          path: preview-site
          ssh-key: ${{ secrets.CGS_PREVIEW_DEPLOY_KEY }}
      - name: Publish the build
        shell: bash
        run: |
          set -euo pipefail
          # CGS-Preview's own README and .gitattributes are not build output.
          rsync -a --delete --exclude .git --exclude README.md --exclude .gitattributes dist/ preview-site/
          cd preview-site
          git add --all
          if git diff --cached --quiet; then
            echo "The preview already matches this build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish CGS reading room preview" -m "Build UConn-Law-Library/CGS at ${GITHUB_SHA::7}."
          git push origin HEAD:main
