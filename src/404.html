<!doctype html>
<html lang="en" data-theme="auto">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Not found · CGS</title>
<script>
  // GitHub Pages serves this page for a missing path at any depth, so relative links would
  // resolve against the missing folder. Resolve them against the app's base path instead;
  // the build fills it in from CGS_SITE_URL, and any other host falls back to the origin root.
  (() => {
    const appBase = "%APP_BASE_PATH%";
    const base = document.createElement("base");
    base.href = location.pathname.startsWith(appBase) ? appBase : "/";
    document.head.append(base);
  })();
</script>
<link rel="stylesheet" href="styles.css"></head>
<body><main class="error" id="main-content"><p class="eyebrow">404</p><h1>Page not found</h1><p><a href="./">Return to the Connecticut General Statutes</a></p></main></body>
</html>
